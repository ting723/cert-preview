[workspace]
resolver = "2"
members = ["crates/cert-core", "crates/cert-wasm", "crates/cert-cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["ting723 <ting723@gmail.com>"]
license = "MIT"
repository = "https://github.com/ting723/cert-preview"

[workspace.dependencies]
cert-core = { path = "crates/cert-core", version = "1.0.0", default-features = false }

asn1-rs = "0.7"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
x509-parser = "0.18"

# Size-first release profile. `panic` is ignored by cargo for test/bench
# profiles, so unit tests and criterion benches keep unwinding.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
